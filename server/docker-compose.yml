# Local dev: the whole Phase-1 system is two moving parts (§7), and this is
# both of them. `docker compose up` gives you the same API the cloud runs.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: rb
      POSTGRES_PASSWORD: rb
      POSTGRES_DB: rb
    # Host port 5433, NOT 5432: a Mac running its own Postgres holds
    # 127.0.0.1:5432, which shadows Docker's 0.0.0.0:5432 forward on
    # loopback. `psql -h localhost` then reads the WRONG database while
    # the API writes to this one — measured 2026-08-09: api_smoke's db
    # checks failed against live data because they were comparing against
    # the host's stale dev db. From the host: psql -h localhost -p 5433.
    ports: ["5433:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rb"]
      interval: 3s
      timeout: 3s
      retries: 20
    volumes: ["rbdata:/var/lib/postgresql/data"]

  api:
    build: .
    depends_on:
      db: { condition: service_healthy }
    environment:
      PG_CONN: "Host=db;Username=rb;Password=rb;Database=rb"
      # Dev-only values. The API refuses to boot without them, deliberately:
      # a default signing key is a key everyone has.
      JWT_SECRET: "dev-only-change-me-0123456789abcdef"
      WORKER_KEY: "dev-only-worker-key"
      BLOB_ROOT: "/var/lib/robotbrawl/blobs"
    ports: ["8080:8080"]

volumes:
  rbdata:
